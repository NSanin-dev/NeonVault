<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">NeonVault</title>
  <desc id="desc">Vaporwave banner: a striped sunset over a neon grid, with the project name in chrome letters and the tech stack in a glossy pill.</desc>

  <defs>
    <!-- Sky: deep night purple fading into a hot pink / peach horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0221"/>
      <stop offset="0.35" stop-color="#2a0a52"/>
      <stop offset="0.62" stop-color="#7a1fa8"/>
      <stop offset="0.85" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#ffb470"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#250646"/>
      <stop offset="1" stop-color="#07000f"/>
    </linearGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="0.45" stop-color="#ffa14f"/>
      <stop offset="1" stop-color="#ff2f8e"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6ec7" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>

    <!-- Chrome lettering -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#c8f7ff"/>
      <stop offset="0.5" stop-color="#5b4bff"/>
      <stop offset="0.72" stop-color="#ff7ad9"/>
      <stop offset="1" stop-color="#fff1b3"/>
    </linearGradient>

    <!-- Frutiger Aero glass -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#9ff3ff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid fades out toward the horizon -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="250" width="1280" height="110" fill="url(#gridFade)"/>
    </mask>

    <!-- Horizontal cuts through the sun -->
    <mask id="sunStripes">
      <rect x="440" y="60" width="400" height="200" fill="#fff"/>
      <rect x="440" y="170" width="400" height="3" fill="#000"/>
      <rect x="440" y="187" width="400" height="5" fill="#000"/>
      <rect x="440" y="204" width="400" height="7" fill="#000"/>
      <rect x="440" y="222" width="400" height="9" fill="#000"/>
      <rect x="440" y="240" width="400" height="11" fill="#000"/>
    </mask>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.09"/>
    </pattern>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="frame"><rect width="1280" height="360" rx="18"/></clipPath>
    <clipPath id="groundClip"><rect x="0" y="250" width="1280" height="110"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Sky -->
    <rect width="1280" height="360" fill="url(#sky)"/>

    <!-- Stars -->
    <g fill="#fff">
      <circle cx="84" cy="38" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="172" cy="96" r="1"/>
      <circle cx="248" cy="30" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="70" r="1"/>
      <circle cx="402" cy="22" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="140" r="0.9"/>
      <circle cx="455" cy="110" r="1"/>
      <circle cx="560" cy="34" r="1.1"/>
      <circle cx="720" cy="28" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="845" cy="60" r="1"/>
      <circle cx="905" cy="20" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="104" r="1"/>
      <circle cx="1050" cy="44" r="1.2"/>
      <circle cx="1130" cy="88" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1200" cy="30" r="1.4"/>
      <circle cx="1240" cy="128" r="0.9"/>
      <circle cx="40" cy="190" r="0.8" fill-opacity="0.6"/>
      <circle cx="1235" cy="200" r="0.8" fill-opacity="0.6"/>
    </g>

    <!-- Sun -->
    <circle cx="640" cy="200" r="190" fill="url(#sunGlow)">
      <animate attributeName="r" values="185;200;185" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="205" r="140" fill="url(#sun)" mask="url(#sunStripes)"/>

    <!-- Mountains -->
    <g fill="#24063f" stroke="#ff5fd8" stroke-width="1.6" stroke-linejoin="round" filter="url(#neon)">
      <polygon points="0,250 0,198 70,178 132,214 202,148 266,204 322,184 404,250"/>
      <polygon points="1280,250 1280,194 1210,174 1150,210 1080,158 1016,204 960,186 876,250"/>
    </g>

    <!-- Ground -->
    <rect x="0" y="250" width="1280" height="110" fill="url(#ground)"/>

    <!-- Neon grid -->
    <g clip-path="url(#groundClip)">
      <g mask="url(#gridMask)" stroke="#00e8ff" stroke-width="1.5" filter="url(#neon)">
        <line x1="540" y1="250" x2="-1060" y2="360"/>
        <line x1="550" y1="250" x2="-890" y2="360"/>
        <line x1="560" y1="250" x2="-720" y2="360"/>
        <line x1="570" y1="250" x2="-550" y2="360"/>
        <line x1="580" y1="250" x2="-380" y2="360"/>
        <line x1="590" y1="250" x2="-210" y2="360"/>
        <line x1="600" y1="250" x2="-40" y2="360"/>
        <line x1="610" y1="250" x2="130" y2="360"/>
        <line x1="620" y1="250" x2="300" y2="360"/>
        <line x1="630" y1="250" x2="470" y2="360"/>
        <line x1="640" y1="250" x2="640" y2="360"/>
        <line x1="650" y1="250" x2="810" y2="360"/>
        <line x1="660" y1="250" x2="980" y2="360"/>
        <line x1="670" y1="250" x2="1150" y2="360"/>
        <line x1="680" y1="250" x2="1320" y2="360"/>
        <line x1="690" y1="250" x2="1490" y2="360"/>
        <line x1="700" y1="250" x2="1660" y2="360"/>
        <line x1="710" y1="250" x2="1830" y2="360"/>
        <line x1="720" y1="250" x2="2000" y2="360"/>
        <line x1="730" y1="250" x2="2170" y2="360"/>
        <line x1="740" y1="250" x2="2340" y2="360"/>

        <!-- Each line slides into the next one's position, so the floor seems to roll toward you -->
        <line x1="0" x2="1280" y1="250" y2="250"><animate attributeName="y1" values="250;253" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="250;253" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="0" x2="1280" y1="253" y2="253"><animate attributeName="y1" values="253;258" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="253;258" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="0" x2="1280" y1="258" y2="258"><animate attributeName="y1" values="258;265" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="258;265" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="0" x2="1280" y1="265" y2="265"><animate attributeName="y1" values="265;274" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="265;274" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="0" x2="1280" y1="274" y2="274"><animate attributeName="y1" values="274;286" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="274;286" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="0" x2="1280" y1="286" y2="286"><animate attributeName="y1" values="286;301" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="286;301" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="0" x2="1280" y1="301" y2="301"><animate attributeName="y1" values="301;319" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="301;319" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="0" x2="1280" y1="319" y2="319"><animate attributeName="y1" values="319;341" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="319;341" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="0" x2="1280" y1="341" y2="341"><animate attributeName="y1" values="341;367" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y2" values="341;367" dur="1.6s" repeatCount="indefinite"/></line>
      </g>
    </g>

    <!-- Horizon glow -->
    <rect x="0" y="246" width="1280" height="8" fill="#ff7ad9" filter="url(#softGlow)" opacity="0.9"/>
    <line x1="0" y1="250" x2="1280" y2="250" stroke="#ffd1f2" stroke-width="1.5"/>

    <!-- Eyebrow + Japanese accent -->
    <text x="640" y="54" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="7" fill="#9ff3ff" filter="url(#neon)">◢ A FULL-STACK C# WEB APP ◣</text>
    <text x="1244" y="40" text-anchor="end" font-family="'Yu Gothic', 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" letter-spacing="4" fill="#ff9fe5" fill-opacity="0.75">フルスタック・ドットネット</text>
    <text x="36" y="40" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#9ff3ff" fill-opacity="0.6">.NET 10 // C#</text>

    <!-- Title: dark outline, chromatic-aberration offsets, then chrome -->
    <g font-family="'Arial Black', 'Segoe UI Black', Impact, 'Helvetica Neue', sans-serif" font-size="108" font-weight="900" text-anchor="middle" letter-spacing="3">
      <text x="640" y="158" fill="none" stroke="#1a0033" stroke-width="10" stroke-linejoin="round">NeonVault</text>
      <text x="636" y="156" fill="#00e8ff" fill-opacity="0.8">NeonVault</text>
      <text x="644" y="160" fill="#ff2fb4" fill-opacity="0.8">NeonVault</text>
      <text x="640" y="158" fill="url(#chrome)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1">NeonVault</text>
    </g>

    <!-- Glossy tech-stack pill -->
    <g>
      <rect x="250" y="286" width="780" height="48" rx="24" fill="#1a0336" fill-opacity="0.6"/>
      <rect x="250" y="286" width="780" height="48" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
      <rect x="266" y="289" width="748" height="20" rx="10" fill="url(#glassShine)" opacity="0.7"/>
      <text x="640" y="317" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#ffffff" stroke="#2a0050" stroke-width="3" stroke-opacity="0.5" paint-order="stroke">C# · BLAZOR WASM · ASP.NET CORE · EF CORE · JWT · STRIPE · IGDB</text>
    </g>

    <!-- CRT scanlines -->
    <rect width="1280" height="360" fill="url(#scanlines)"/>
  </g>
</svg>
